[project]
name = "interis"
version = "0.1.0"
description = "Local, offline interview transcription and comparison for qualitative research"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
    # ML pipeline – version floors exclude known CVEs, see DEPENDENCIES.md
    "torch>=2.10",
    "torchaudio>=2.10",
    "numpy>=2.1",
    "faster-whisper>=1.2",
    "ctranslate2>=4.8.1",
    "transformers>=5.3",
    "pyannote.audio>=4.0",
    "huggingface-hub>=0.28.1",
    "safetensors>=0.5.2",
    # Export
    "python-docx>=1.1",
    "truststore>=0.10",
]

[project.scripts]
interis = "interis.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interis"]

[tool.uv]
# Supply-chain cooldown: ignore releases younger than 7 days.
exclude-newer = "7 days"
# Use a dedicated uv-managed interpreter (not the Microsoft Store Python), so the
# firewall rule can target exactly this interpreter.
python-preference = "only-managed"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests
